<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Clothes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="clothes-page">
      <header class="clothes-header">
        <p class="eyebrow">Wardrobe</p>
        <h1>My Clothes</h1>
        <a href="index.html" class="page-link">Back to Weather</a>
      </header>

      <div class="clothes-card">
        <div class="clothes-entry-grid">
          <form id="top-clothes-form" class="clothes-form" data-type="tops" aria-label="Save a top item">
            <label for="top-clothes-input">Add a top</label>
            <div class="clothes-input-row">
              <input id="top-clothes-input" type="text" name="top" placeholder="Example: hoodie" />
              <select id="top-clothes-category" aria-label="Choose a top weather category">
                <option value="hot">Hot</option>
                <option value="mild" selected>Mild</option>
                <option value="cold">Cold</option>
              </select>
            </div>
            <button type="submit">Save Top</button>
          </form>

          <form id="bottom-clothes-form" class="clothes-form" data-type="bottoms" aria-label="Save a bottom item">
            <label for="bottom-clothes-input">Add a bottom</label>
            <div class="clothes-input-row">
              <input id="bottom-clothes-input" type="text" name="bottom" placeholder="Example: shorts" />
              <select id="bottom-clothes-category" aria-label="Choose a bottom weather category">
                <option value="hot">Hot</option>
                <option value="mild" selected>Mild</option>
                <option value="cold">Cold</option>
              </select>
            </div>
            <button type="submit">Save Bottom</button>
          </form>
        </div>

        <div class="clothes-groups">
          <section class="clothes-group">
            <h2>Tops</h2>
            <ul id="tops-list" class="clothes-list" aria-live="polite"></ul>
          </section>

          <section class="clothes-group">
            <h2>Bottoms</h2>
            <ul id="bottoms-list" class="clothes-list" aria-live="polite"></ul>
          </section>
        </div>

        <ul id="clothes-list" class="clothes-list legacy-list" aria-live="polite"></ul>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
